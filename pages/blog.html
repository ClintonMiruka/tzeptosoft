<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tzeptosoft Blog Archives - Raw, unfiltered wisdom for men and women to build empires, secure relationships, and dominate life.">
    <meta name="author" content="Clinton | Tzeptosoft">
    <meta property="og:title" content="Tzeptosoft Blog Archives | Complete Collection of Raw Wisdom">
    <meta property="og:description" content="Tzeptosoft Blog Archives - Raw, unfiltered wisdom for men and women to build empires, secure relationships, and dominate life.">
    <meta property="og:type" content="website">
    <title>Tzeptosoft Blog Archives | Complete Collection of Raw Wisdom</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/pages/pages-blog-html.css">
    <link rel="icon" type="image/webp" href="../assets/favicon.webp">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Tzeptosoft Blog Archives",
        "description": "Complete collection of raw, unfiltered wisdom articles for men and women building empires.",
        "url": "https://tzeptosoft.com/blog",
        "publisher": {
            "@type": "Organization",
            "name": "Tzeptosoft",
            "logo": {
                "@type": "ImageObject",
                "url": "https://tzeptosoft.com/assets/logo.webp"
            }
        }
    }
    </script>
</head>
<body data-page="blog">
    <div id="site-header"></div>
    <main class="page-content">
<div id="preloader">
        <div class="loader">Loading Blog Archives... ⚔️</div>
    </div>

    <!-- Professional Header -->
    

    <div class="main-content">
        <!-- Background Elements -->
        <div id="galaxy-bg"></div>
        <div id="matrix-bg"></div>
        <div id="particles"></div>
        <div id="cursor-trail"></div>

        <!-- Blog Hero -->
        <section class="blog-hero">
            <h1>TZEPTOSOFT BLOG ARCHIVES</h1>
            <p class="blog-hero-subtitle">Every article, every lesson, every piece of raw wisdom from Tzeptosoft. 140+ articles of unfiltered truth to escape the matrix and build your empire.</p>
            <div class="stats-counter">
                <div class="stat-item">
                    <div class="stat-number">140+</div>
                    <div class="stat-label">Articles</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">7</div>
                    <div class="stat-label">Categories</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">500k+</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">∞</div>
                    <div class="stat-label">Wisdom</div>
                </div>
            </div>
        </section>

        <!-- Blog Content -->
        <div class="blog-container">
            <!-- Filters and Controls -->
            <div class="blog-controls">
                <div class="category-filters">
                    <button class="filter-btn active" data-category="all">All Articles</button>
                    <button class="filter-btn" data-category="masculinity">Masculinity</button>
                    <button class="filter-btn" data-category="femininity">Femininity</button>
                    <button class="filter-btn" data-category="wealth">Wealth</button>
                    <button class="filter-btn" data-category="mindset">Mindset</button>
                    <button class="filter-btn" data-category="tech">Tech</button>
                    <button class="filter-btn" data-category="relationships">Relationships</button>
                    <button class="filter-btn" data-category="life">Life</button>
                </div>
                <div class="sort-controls">
                    <span class="sort-label">Sort by:</span>
                    <select class="sort-select" id="sortSelect">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="popular">Most Popular</option>
                        <option value="title">Title A-Z</option>
                    </select>
                </div>
            </div>

            <!-- Articles Grid -->
            <div class="articles-archive-grid" id="articlesGrid">
                <!-- Articles will be dynamically loaded here -->
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <button class="page-btn prev-btn" id="prevBtn">← Previous</button>
                <div class="page-numbers" id="pageNumbers">
                    <!-- Page numbers will be dynamically generated -->
                </div>
                <button class="page-btn next-btn" id="nextBtn">Next →</button>
            </div>
        </div>

        <!-- Footer -->
        
    </div>
</main>
    <div id="site-footer"></div>
    <script src="../assets/js/layout-loader.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/pages/pages-blog-html.js" defer></script>
</body>
</html>
