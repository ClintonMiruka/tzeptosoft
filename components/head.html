<!-- Shared head template. Replace {{page_title}}, {{page_description}}, and {{page_url}} when generating a page. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{page_description}}">
<meta name="author" content="Clinton | Tzeptosoft">
<meta property="og:title" content="{{page_title}} | Tzeptosoft">
<meta property="og:description" content="{{page_description}}">
<meta property="og:url" content="{{page_url}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>{{page_title}} | Tzeptosoft</title>
<link rel="stylesheet" href="{{root}}assets/css/global.css">
<link rel="icon" type="image/webp" href="{{root}}assets/favicon.webp">
